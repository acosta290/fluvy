version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # pinned to the versions Home Assistant's frontend ships
      - dependency-name: lit
      - dependency-name: '@mdi/js'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
