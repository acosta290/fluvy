name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # the community palettes' index is generated by the build: a file added without it fails here
      - run: git diff --exit-code -- packages/tokens/src/palettes/community/index.ts
      - run: pnpm check
      - run: node tools/release/check.mjs --release
      - uses: actions/upload-artifact@v7
        with:
          name: custom_components-fluvy
          path: custom_components/fluvy
          if-no-files-found: error
          retention-days: 7

  python:
    name: Integration (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check custom_components
      - run: ruff format --check custom_components

  visual:
    name: Measurer and interactions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fluvy/render exec playwright install --with-deps chromium
      - name: Start the playground
        run: |
          FLUVY_NO_HMR=1 pnpm --filter @fluvy/playground dev > playground.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5183/ > /dev/null && break; sleep 1; done
      - run: pnpm visual
      # advisory: every card's declared height against what it measures at 360
      - run: node tools/render/heights.mjs
      # every sheet and every panel tab at 360, 412 and 1400: 0 violations each
      - run: pnpm measure --out out/measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-reports
          path: |
            out
            playground.log
