<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palette gallery — design lab</title>
    <link rel="stylesheet" href="../lab.css" />
    <link rel="stylesheet" href="../gallery.css" />
  </head>
  <body>
    <header class="lab-bar" data-lab-chrome>
      <h1 class="lab-bar__title">Palette gallery</h1>
      <span class="lab-bar__spacer"></span>
      <span class="lab-field">Each palette, light and dark, on one dashboard</span>
    </header>

    <main class="lab-sheets" id="sheets"></main>

    <!-- Generated by `pnpm --filter @fluvy/tokens build`. Classic scripts, so file:// works. -->
    <script src="../../../packages/tokens/dist/palettes.js"></script>
    <script src="../glyphs.js"></script>
    <script src="../gallery.js"></script>

    <!-- The alignment measurer treats each phone mock as a frame; gallery.js assembles them
         synchronously above, so tagging them here needs no hook inside the builder. -->
    <script>
      for (const phone of document.querySelectorAll('.phone')) {
        phone.dataset.frame = phone.dataset.mode;
      }
    </script>
  </body>
</html>
