<!doctype html>
<html lang="en" data-palette="linen" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icons — fluvy design lab</title>
    <link rel="stylesheet" href="../lab.css" />
    <link rel="stylesheet" href="../../../packages/ui/styles/fluvy.css" />
    <style>
      /* the sheet's own: a frame is a desktop's column, light over dark, each family a card of its glyphs */
      .lab-sheet--wide {
        grid-template-columns: 1040px;
        width: 1104px;
      }
      .ic-frame {
        width: 1040px;
      }
      .ic-family + .ic-family {
        margin-top: 16px;
      }
      .ic-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
        gap: 16px 12px;
        margin-top: 16px;
      }
      .ic-glyph {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin: 0;
      }
      .ic-sizes {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
      }
      .ic-bare {
        display: inline-flex;
        color: var(--fluvy-text);
      }
      .ic-bare--16 svg {
        width: 16px;
        height: 16px;
      }
      .ic-bare--24 svg {
        width: 24px;
        height: 24px;
      }
      .ic-name {
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
        color: var(--fluvy-text-secondary);
      }
    </style>
  </head>
  <body class="lab-page">
    <section class="lab-sheet lab-sheet--wide" data-sheet="icons" id="icons"></section>
    <script src="../fluvy.js"></script>
    <script src="../icons.js"></script>
    <script>
      Promise.all(['600 13px Inter', '600 14px Inter', '500 13px Inter', '600 16px Inter', '600 40px Inter'].map((f) => document.fonts.load(f))).then((faces) => document.fonts.ready.then(() => faces)).then((faces) => {
        if (!faces.every((list) => list.length) || !document.fonts.check('600 13px Inter')) throw new Error('Inter did not load');
        renderIcons(document.getElementById('icons'));
        FLUVY.fit(document);
        const frameMode = new URLSearchParams(location.search).get('frame');
        if (frameMode) document.querySelectorAll('[data-frame]').forEach((f) => { f.dataset.mode = frameMode; });
        document.documentElement.dataset.labReady = '1';
      });
    </script>
  </body>
</html>
