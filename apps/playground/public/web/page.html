<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A page on the playground</title>
    <style>
      /* a plain page of its own, as a site the card frames would be: its own ground, its own type, no theme of ours */
      html {
        background: #f3efe8;
        color: #2a2520;
        font: 15px/1.5 system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 20px 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(16px, 9vw, 22px);
        line-height: 1.3;
      }
      p {
        margin: 0;
        max-width: 48ch;
      }
      .swatches {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .swatches span {
        width: 40px;
        height: 40px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>A page on the playground</h1>
    <p>
      The web page card frames this page from the playground's own origin, so its load reaches the card and the
      plate draws. A page of the internet would look the same from here.
    </p>
    <div class="swatches" aria-hidden="true">
      <span style="background: #d7a86e"></span>
      <span style="background: #6e9bd7"></span>
      <span style="background: #7fbf7a"></span>
      <span style="background: #c76d6d"></span>
    </div>
  </body>
</html>
